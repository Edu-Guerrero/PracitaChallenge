server:
  port: 8081
spring:
  application:
    name: accounts_movements_service
  datasource:
    url: jdbc:postgresql://localhost:5432/challenge_db
    username: challenge_user
    password: challenge_pwd
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        default_schema: banking
        format_sql: true
  webflux:
    base-path: /api/v1

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

optimus:
  http-client:
    customer-service:
      base-path: http://localhost:8080/api/v1